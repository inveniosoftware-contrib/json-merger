name: Pull request master

on:
  push:
    branches: [master]

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    with:
      ref: ${{ github.sha }}

  python3_tests:
    needs: [lint]
    uses: ./.github/workflows/test-python-3.yml

  bump_version:
    needs: [python3_tests]
    uses: ./.github/workflows/bump-and-publish.yml
    secrets: inherit
